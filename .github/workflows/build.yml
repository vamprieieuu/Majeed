name: Build MAJEED.aex

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build MAJEED target
        run: cmake --build build --config Release --target MAJEED --parallel

      - name: Verify AEX
        shell: pwsh
        run: |
          $aex = Get-ChildItem -Path build -Filter MAJEED.aex -Recurse -File | Select-Object -First 1
          if (-not $aex) {
            Write-Host "MAJEED.aex was not found. Built files:"
            Get-ChildItem -Path build -Recurse -File | Where-Object { $_.Extension -in '.aex','.dll','.lib','.obj','.rc' } | Select-Object FullName,Length
            Write-Error "MAJEED.aex was not produced."
            exit 1
          }
          Write-Host "Built: $($aex.FullName)"
          Get-Item $aex.FullName | Format-List FullName,Length,LastWriteTime

      - name: Upload MAJEED.aex
        uses: actions/upload-artifact@v4
        with:
          name: MAJEED-aex
          path: build/**/MAJEED.aex
          if-no-files-found: error
